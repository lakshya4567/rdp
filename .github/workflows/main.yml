name: Build Single Portable RailSaathi EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Nativefier
        run: npm install -g nativefier

      - name: Build App Folder
        run: nativefier --name "RailSaathi" --platform windows --arch x64 --single-instance "https://isroot.in"

      - name: Create 7-Zip SFX Config
        run: |
          Set-Content -Path "config.txt" -Value ';!@Install@!UTF-8!
          RunProgram="RailSaathi.exe"
          ;!@InstallEnd@!' -Encoding UTF8

      - name: Pack into Single Portable EXE
        run: |
          cd RailSaathi-win32-x64
          7z a -mx=5 ..\app.7z *
          cd ..
          cmd /c copy /b "C:\Program Files\7-Zip\7z.sfx" + config.txt + app.7z RailSaathi-Portable.exe

      - name: Upload Single EXE
        uses: actions/upload-artifact@v4
        with:
          name: RailSaathi-Portable-EXE
          path: RailSaathi-Portable.exe
