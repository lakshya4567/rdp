name: Build Pure Go Single EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Create Go WebView App
        run: |
          go mod init railsaathi
          go get ://github.com
          Set-Content -Path "main.go" -Value '
          package main

          import "://github.com"

          func main() {
              w := webview.New(false)
              defer w.Destroy()
              w.SetTitle("RailSaathi")
              w.SetSize(1200, 800, webview.HintNone)
              w.Navigate("https://railsaathi.isroot.in")
              w.Run()
          }'

      - name: Build Single EXE (No Console Window)
        run: go build -ldflags="-H windowsgui -s -w" -o RailSaathi.exe .

      - name: Upload Single EXE
        uses: actions/upload-artifact@v4
        with:
          name: RailSaathi-Single-EXE
          path: RailSaathi.exe
