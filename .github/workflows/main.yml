name: Build Single File RailSaathi EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Create WinForms WebView2 App
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "app" | Out-Null

          Set-Content -Path "app/RailSaathi.csproj" -Value @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>WinExe</OutputType>
              <TargetFramework>net8.0-windows</TargetFramework>
              <UseWindowsForms>true</UseWindowsForms>
              <ImplicitUsings>enable</ImplicitUsings>
              <PublishSingleFile>true</PublishSingleFile>
              <SelfContained>true</SelfContained>
              <RuntimeIdentifier>win-x64</RuntimeIdentifier>
              <IncludeNativeLibrariesForSelfExtract>true</IncludeNativeLibrariesForSelfExtract>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.Web.WebView2" Version="1.0.2903.40" />
            </ItemGroup>
          </Project>
          '@

          Set-Content -Path "app/Program.cs" -Value @'
          using System;
          using System.Windows.Forms;
          using Microsoft.Web.WebView2.WinForms;

          namespace RailSaathi
          {
              internal static class Program
              {
                  [STAThread]
                  static void Main()
                  {
                      Application.EnableVisualStyles();
                      Application.SetCompatibleTextRenderingDefault(false);
                      var form = new Form
                      {
                          Text = "RailSaathi",
                          Width = 1200,
                          Height = 800,
                          StartPosition = FormStartPosition.CenterScreen
                      };
                      var webView = new WebView2
                      {
                          Dock = DockStyle.Fill,
                          Source = new Uri("https://railsaathi.isroot.in")
                      };
                      form.Controls.Add(webView);
                      Application.Run(form);
                  }
              }
          }
          '@

      - name: Publish Single EXE
        shell: pwsh
        run: dotnet publish app/RailSaathi.csproj -c Release -r win-x64 -o output

      - name: Upload Single EXE
        uses: actions/upload-artifact@v4
        with:
          name: RailSaathi-Single-EXE
          path: output/RailSaathi.exe
